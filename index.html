<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eurovision 2026 — Моє голосування</title>
  <link rel="stylesheet" href="theme.css" />
  <style>

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #150830;
      min-height: 100vh;
      color: var(--text);
      padding: 16px 12px 48px;
    }

    /* ── Animated background orbs ── */
    .bg-orb {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      filter: blur(80px);
    }

    .orb-pink {
      width: 90vw; height: 90vw;
      background: radial-gradient(circle, rgba(255,148,198,0.72) 0%, rgba(235,110,170,0.44) 40%, transparent 70%);
      left: -22vw; top: -22vh;
      animation: path-pink 18s ease-in-out infinite;
      animation-delay: -9s;
    }
    .orb-cyan {
      width: 80vw; height: 80vw;
      background: radial-gradient(circle, rgba(130,215,255,0.65) 0%, rgba(100,185,245,0.40) 40%, transparent 70%);
      right: -18vw; top: -18vh;
      animation: path-cyan 23s ease-in-out infinite;
      animation-delay: -11s;
    }
    .orb-purple {
      width: 85vw; height: 85vw;
      background: radial-gradient(circle, rgba(165,108,238,0.68) 0%, rgba(130,78,205,0.42) 45%, transparent 70%);
      left: 10vw; top: 25vh;
      animation: path-purple 20s ease-in-out infinite;
      animation-delay: -6s;
    }
    .orb-indigo {
      width: 80vw; height: 80vw;
      background: radial-gradient(circle, rgba(70,45,150,0.78) 0%, transparent 70%);
      left: 10vw; bottom: -25vh;
      animation: path-indigo 26s ease-in-out infinite;
      animation-delay: -16s;
    }

    /* Multi-waypoint loops — starts mid-path so movement is instant on load */
    @keyframes path-pink {
      0%   { transform: translate(0,     0   ); }
      30%  { transform: translate(22vw,  16vh); }
      60%  { transform: translate(10vw,  28vh); }
      100% { transform: translate(0,     0   ); }
    }
    @keyframes path-cyan {
      0%   { transform: translate(0,      0   ); }
      35%  { transform: translate(-20vw,  22vh); }
      65%  { transform: translate(-8vw,   12vh); }
      100% { transform: translate(0,      0   ); }
    }
    @keyframes path-purple {
      0%   { transform: translate(0,     0    ); }
      40%  { transform: translate(16vw, -20vh); }
      70%  { transform: translate(-8vw, -10vh); }
      100% { transform: translate(0,     0    ); }
    }
    @keyframes path-indigo {
      0%   { transform: translate(0,      0   ); }
      30%  { transform: translate(-14vw, -22vh); }
      65%  { transform: translate(12vw,  -14vh); }
      100% { transform: translate(0,      0   ); }
    }

    /* ── Noise grain veil ── */
    .noise-veil {
      position: fixed;
      inset: -50%;
      width: 200%;
      height: 200%;
      z-index: 1;
      pointer-events: none;
      opacity: 0.08;
      mix-blend-mode: overlay;
      animation: noiseShift 55s ease-in-out infinite alternate;
      will-change: transform;
    }

    @keyframes noiseShift {
      0%   { transform: translate(0,   0  ); }
      33%  { transform: translate(-6%, -4%); }
      66%  { transform: translate(5%,  -7%); }
      100% { transform: translate(-3%,  5%); }
    }

    /* ── Logo ── */
    header {
      text-align: center;
      padding: 24px 0 32px;
      user-select: none;
    }

    .logo-heart {
      font-size: 36px;
      line-height: 1;
      filter: drop-shadow(0 0 12px #ff2d7888);
    }

    .logo-esc {
      font-size: clamp(22px, 5vw, 34px);
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
      background: linear-gradient(90deg, var(--cyan), #ffffff 50%, var(--pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.1;
      margin: 4px 0 2px;
    }

    .logo-sub {
      font-size: 11px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    .logo-city {
      font-size: 13px;
      letter-spacing: 3px;
      color: var(--text-sub);
      margin-top: 6px;
    }

    /* ── Container ── */
    .wrap {
      position: relative;
      z-index: 2;
      max-width: 960px;
      margin: 0 auto;
    }

    /* ── Table ── */
    .table-outer {
      overflow-x: auto;
      border-radius: 14px;
      border: 1px solid var(--border-strong);
      background: rgba(0 0 0 / 0.25);
      backdrop-filter: blur(12px);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 680px;
    }

    thead th {
      background: rgba(0 0 0 / 0.35);
      padding: 13px 10px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-dim);
      border-bottom: 1px solid var(--border-strong);
      text-align: center;
      white-space: nowrap;
    }

    thead th.th-country {
      text-align: left;
      padding-left: 14px;
    }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--surface-hover); }
    tbody tr:nth-child(even) { background: var(--surface); }
    tbody tr:nth-child(even):hover { background: var(--surface-hover); }

    td {
      padding: 13px 10px;
      vertical-align: middle;
      text-align: center;
    }

    .td-num {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-dim);
      letter-spacing: 1px;
      width: 42px;
      padding-left: 16px;
    }

    .td-country {
      text-align: left;
      padding-left: 10px;
    }

    .country-cell {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .flag {
      font-size: 30px;
      line-height: 1;
      flex-shrink: 0;
    }

    .country-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.2;
    }

    .artist-name {
      font-size: 13px;
      color: var(--text-sub);
      line-height: 1.3;
    }

    .song-name {
      font-size: 12px;
      color: var(--text-dim);
      font-style: italic;
      line-height: 1.3;
    }

    /* ── Rating buttons ── */
    .rating-btn {
      width: 56px;
      height: 42px;
      background: var(--input-bg);
      border: 1.5px solid var(--border-strong);
      border-radius: 10px;
      color: var(--text-dim);
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition: border-color 0.18s, background 0.18s, box-shadow 0.18s, color 0.18s;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      user-select: none;
    }
    .rating-btn:hover {
      border-color: var(--cyan);
      background: rgba(0 212 245 / 0.10);
    }
    .rating-btn.has-value          { color: var(--cyan); border-color: rgba(0 212 245 / 0.45); }
    .rating-btn.col-score.has-value{ color: var(--pink); border-color: rgba(255 45 120 / 0.45); }

    /* ── Popup ── */
    .rating-popup {
      position: fixed;
      z-index: 100;
      background: rgba(18 8 48 / 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255 255 255 / 0.16);
      border-radius: 16px;
      box-shadow: 0 16px 48px rgba(0 0 0 / 0.55), 0 0 0 1px rgba(255 255 255 / 0.05);
      padding: 12px 10px 10px;
      display: none;
      min-width: 290px;
    }
    .rating-popup.open { display: block; }

    .popup-label {
      font-size: 9px; font-weight: 700; letter-spacing: 2px;
      text-transform: uppercase; color: var(--text-dim);
      text-align: center; margin-bottom: 10px;
    }

    /* numbers 1–10: 5 per row */
    .popup-nums {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }
    .pop-num {
      height: 42px;
      background: rgba(255 255 255 / 0.05);
      border: 1.5px solid rgba(255 255 255 / 0.10);
      border-radius: 10px;
      font-size: 17px; font-weight: 800; color: var(--text);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
    }
    .pop-num:hover { background: rgba(0 212 245 / 0.18); border-color: var(--cyan); transform: scale(1.07); }
    .pop-num.active { background: rgba(0 212 245 / 0.25); border-color: var(--cyan); color: var(--cyan); }

    .popup-divider {
      border: none; border-top: 1px solid rgba(255 255 255 / 0.08);
      margin: 10px 0;
    }

    /* emoji reactions: 5 per row */
    .popup-emojis {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }
    .pop-emoji {
      height: 44px;
      background: rgba(255 255 255 / 0.05);
      border: 1.5px solid rgba(255 255 255 / 0.10);
      border-radius: 10px;
      font-size: 22px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.12s;
      display: flex; align-items: center; justify-content: center;
    }
    .pop-emoji:hover { background: rgba(255 45 120 / 0.15); border-color: var(--pink); transform: scale(1.12); }
    .pop-emoji.active { background: rgba(255 45 120 / 0.28); border-color: var(--pink); }

    .popup-clear {
      display: block; width: 100%; margin-top: 8px; padding: 5px 0;
      background: none; border: 1px solid rgba(255 255 255 / 0.08);
      border-radius: 7px; color: var(--text-dim);
      font-size: 11px; letter-spacing: 1px; cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .popup-clear:hover { border-color: var(--pink); color: var(--pink); }

    /* emoji shown in rating button */
    .rating-btn.is-emoji { font-size: 20px; }

    /* ── Toolbar ── */
    .toolbar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 12px;
      margin-top: 16px;
    }

    .btn {
      padding: 8px 18px;
      border-radius: 8px;
      border: 1.5px solid var(--border-strong);
      background: var(--surface);
      color: var(--text-sub);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn:hover {
      background: var(--surface-hover);
      color: var(--text);
      border-color: var(--cyan);
    }

    /* ── Rankings ── */
    .rankings-section {
      margin-top: 28px;
    }

    .rankings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
      gap: 8px;
      padding: 16px 18px 18px;
    }

    .rank-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      transition: background 0.15s;
    }
    .rank-card:hover { background: var(--surface-hover); }

    .rank-pos {
      font-size: 13px;
      font-weight: 900;
      color: var(--text-dim);
      min-width: 22px;
    }
    .rank-pos.top1 { color: var(--gold); }
    .rank-pos.top2 { color: #c0c0c0; }
    .rank-pos.top3 { color: #cd7f32; }

    .rank-flag { font-size: 18px; }

    .rank-info { flex: 1; min-width: 0; }

    .rank-country {
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .rank-score {
      font-size: 17px;
      font-weight: 900;
      color: var(--cyan);
      flex-shrink: 0;
    }

    /* ── Picks section ── */
    .picks-section { margin-top: 28px; }

    .picks-card {
      background: rgba(255 255 255 / 0.11);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255 255 255 / 0.22);
      border-radius: 16px;
      overflow: hidden;
    }

    .picks-title {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 3px;
      padding: 18px 22px 16px;
      color: var(--text);
      border-bottom: 1px solid rgba(255 255 255 / 0.10);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-dl-btn {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 6px 14px;
      background: rgba(255 255 255 / 0.08);
      border: 1.5px solid rgba(255 255 255 / 0.18);
      border-radius: 8px;
      color: var(--text-sub);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      flex-shrink: 0;
    }
    .card-dl-btn:hover { background: rgba(255 255 255 / 0.16); border-color: var(--cyan); color: var(--text); }

    .pick-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 13px 22px;
      border-bottom: 1px solid rgba(255 255 255 / 0.07);
    }
    .pick-row:last-child { border-bottom: none; }

    .pick-row.winner-row {
      background: rgba(255 215 0 / 0.08);
      border-top: 1px solid rgba(255 215 0 / 0.25);
      padding: 16px 22px;
    }

    .pick-label {
      font-size: 13px;
      font-weight: 800;
      font-style: italic;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text);
      flex-shrink: 0;
    }

    .pick-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      min-width: 175px;
      justify-content: space-between;
      background: rgba(255 255 255 / 0.07);
      border: 1.5px solid rgba(255 255 255 / 0.18);
      border-radius: 10px;
      color: var(--text-dim);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      white-space: nowrap;
    }
    .pick-btn:hover { border-color: var(--cyan); background: rgba(0 212 245 / 0.10); color: var(--text); }
    .pick-btn.has-value { color: var(--text); border-color: rgba(255 255 255 / 0.32); }
    .winner-row .pick-btn { border-color: rgba(255 215 0 / 0.35); }
    .winner-row .pick-btn:hover { border-color: var(--gold); background: rgba(255 215 0 / 0.10); }
    .winner-row .pick-btn.has-value { border-color: rgba(255 215 0 / 0.65); color: var(--gold); }

    .pick-btn-inner { display: flex; align-items: center; gap: 7px; }
    .pick-chevron { color: var(--text-dim); font-size: 11px; margin-left: 4px; }

    .pick-expanded {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 10px 22px 14px;
    }
    .pick-expanded:empty { display: none; }

    .pick-expanded-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 12px;
      background: rgba(255 255 255 / 0.06);
      border: 1px solid rgba(255 255 255 / 0.08);
      border-radius: 9px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }
    .pick-expanded-flag { font-size: 20px; line-height: 1; }
    .pick-expanded-artist { font-size: 11px; color: var(--text-dim); margin-left: auto; font-style: italic; }

    /* ── Country picker popup ── */
    .cpicker {
      position: fixed;
      z-index: 101;
      background: rgba(14 6 40 / 0.97);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255 255 255 / 0.16);
      border-radius: 14px;
      box-shadow: 0 16px 48px rgba(0 0 0 / 0.65);
      display: none;
      flex-direction: column;
      width: 300px;
      max-height: 440px;
    }
    .cpicker.open { display: flex; }

    .cpicker-header {
      padding: 11px 14px 9px;
      border-bottom: 1px solid rgba(255 255 255 / 0.08);
      font-size: 9px; font-weight: 700; letter-spacing: 2px;
      text-transform: uppercase; color: var(--text-dim);
      flex-shrink: 0;
    }

    .cpicker-list { overflow-y: auto; flex: 1; }

    .cpicker-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 14px;
      cursor: pointer;
      border-bottom: 1px solid rgba(255 255 255 / 0.04);
      transition: background 0.12s;
    }
    .cpicker-item:last-child { border-bottom: none; }
    .cpicker-item:hover { background: rgba(255 255 255 / 0.07); }
    .cpicker-item.selected { background: rgba(0 212 245 / 0.12); }
    .winner-mode .cpicker-item.selected { background: rgba(255 215 0 / 0.12); }

    .cpicker-num  { font-size: 10px; color: var(--text-dim); font-weight: 700; min-width: 22px; }
    .cpicker-flag { font-size: 20px; line-height: 1; }
    .cpicker-info { flex: 1; min-width: 0; }
    .cpicker-name { font-size: 13px; font-weight: 700; }
    .cpicker-artist { font-size: 11px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cpicker-check { color: var(--cyan); font-size: 15px; flex-shrink: 0; }
    .winner-mode .cpicker-check { color: var(--gold); }

    .cpicker-footer {
      display: flex; align-items: center; justify-content: space-between;
      padding: 9px 14px;
      border-top: 1px solid rgba(255 255 255 / 0.08);
      flex-shrink: 0;
    }
    .cpicker-count { font-size: 11px; color: var(--text-dim); }
    .cpicker-confirm {
      padding: 5px 16px;
      background: var(--cyan); border: none; border-radius: 7px;
      font-size: 12px; font-weight: 800; color: #080618; cursor: pointer;
      transition: opacity 0.15s;
    }
    .cpicker-confirm:disabled { opacity: 0.35; cursor: default; }
  </style>
</head>
<body>

<div class="bg-orb orb-pink"   aria-hidden="true"></div>
<div class="bg-orb orb-cyan"   aria-hidden="true"></div>
<div class="bg-orb orb-purple" aria-hidden="true"></div>
<div class="bg-orb orb-indigo" aria-hidden="true"></div>

<div class="noise-veil" aria-hidden="true">
  <svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
    <defs>
      <filter id="fnoise" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.0042 0.0058" numOctaves="6" seed="7"/>
      </filter>
    </defs>
    <rect width="100%" height="100%" filter="url(#fnoise)"/>
  </svg>
</div>

<div class="wrap">

  <header>
    <div class="logo-heart">♥</div>
    <div class="logo-esc">Eurovision</div>
    <div class="logo-sub">Song Contest</div>
    <div class="logo-city">Відень · 16 травня 2026 · Гранд-фінал</div>
  </header>

  <div class="table-outer">
    <table id="main-table">
      <thead>
        <tr>
          <th>#</th>
          <th class="th-country">Країна / Виконавець / Пісня</th>
          <th>Вокал</th>
          <th>Образ</th>
          <th>Номер</th>
          <th>Оцінка</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="toolbar">
    <button class="btn" id="btn-reset">Скинути все</button>
  </div>

  <div class="rankings-section" id="rankings-section" style="display:none">
    <div class="picks-card">
      <div class="picks-title">МІЙ РЕЙТИНГ <button class="card-dl-btn" id="btn-dl-ranking">📸 Зображення</button></div>
      <div class="rankings-grid" id="rankings-grid"></div>
    </div>
  </div>

  <div class="picks-section">
    <div class="picks-card" id="picks-card">
      <div class="picks-title">ОТЖЕ <button class="card-dl-btn" id="btn-dl-picks">📸 Зображення</button></div>
      <!-- rows injected by JS -->
    </div>
  </div>

</div>

<!-- Country picker popup -->
<div id="cpicker" class="cpicker" role="dialog">
  <div class="cpicker-header" id="cpicker-header"></div>
  <div class="cpicker-list" id="cpicker-list"></div>
  <div class="cpicker-footer" id="cpicker-footer" style="display:none">
    <span class="cpicker-count" id="cpicker-count"></span>
    <button class="cpicker-confirm" id="cpicker-confirm">Готово</button>
  </div>
</div>

<!-- Rating popup -->
<div id="rating-popup" class="rating-popup" role="dialog" aria-modal="true">
  <div class="popup-label" id="popup-label"></div>
  <div class="popup-nums" id="popup-nums"></div>
  <hr class="popup-divider">
  <div class="popup-emojis" id="popup-emojis"></div>
  <button class="popup-clear" id="popup-clear">✕ Прибрати оцінку</button>
</div>

<script src="data/countries.js"></script>
<script src="data/config.js"></script>
<script>
  const EMOJI_SCORE = Object.fromEntries(EMOJI_OPTIONS.map(o => [o.e, o.v]));

  const STORAGE_KEY = 'esc2026_votes';
  let votes = {};
  try { votes = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch {}

  function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(votes)); }
  function key(idx, crit) { return `${idx}_${crit}`; }

  function scoreOf(val) {
    if (val == null) return 0;
    const n = Number(val);
    return isNaN(n) ? (EMOJI_SCORE[val] ?? 0) : n;
  }

  function rowTotal(idx) {
    return CRITERIA.reduce((s, c) => s + scoreOf(votes[key(idx, c)]), 0);
  }

  // ── Build table ──
  const tbody = document.getElementById('tbody');

  COUNTRIES.forEach((c, idx) => {
    const tr  = document.createElement('tr');
    const num = String(idx + 1).padStart(2, '0');

    const critCells = CRITERIA.map((crit, ci) => {
      const isScore = ci === 3;
      const stored  = votes[key(idx, crit)];
      const isEmoji = stored != null && isNaN(Number(stored));
      const cls = [
        'rating-btn',
        isScore  ? 'col-score' : '',
        stored   ? 'has-value' : '',
        isEmoji  ? 'is-emoji'  : '',
      ].filter(Boolean).join(' ');
      return `<td><button class="${cls}" data-idx="${idx}" data-crit="${crit}">${stored ?? '—'}</button></td>`;
    }).join('');

    tr.innerHTML = `
      <td class="td-num">${num}</td>
      <td class="td-country">
        <div class="country-cell">
          <span class="flag">${c.flag}</span>
          <div>
            <div class="country-name">${c.name}</div>
            <div class="artist-name">${c.artist}</div>
            <div class="song-name">${c.song}</div>
          </div>
        </div>
      </td>
      ${critCells}
    `;
    tbody.appendChild(tr);
  });

  // ── Popup ──
  const popup     = document.getElementById('rating-popup');
  const popNums   = document.getElementById('popup-nums');
  const popEmojis = document.getElementById('popup-emojis');
  const popLabel  = document.getElementById('popup-label');
  const popClear  = document.getElementById('popup-clear');
  let activeBtn   = null;

  // Build static content once
  popNums.innerHTML = Array.from({length: 10}, (_, i) =>
    `<button class="pop-num" data-val="${i+1}">${i+1}</button>`
  ).join('');

  popEmojis.innerHTML = EMOJI_OPTIONS.map(o =>
    `<button class="pop-emoji" data-val="${o.e}" title="= ${o.v} балів">${o.e}</button>`
  ).join('');

  function openPopup(btn) {
    activeBtn = btn;
    popLabel.textContent = CRIT_LABELS[btn.dataset.crit] || '';

    const cur = votes[key(btn.dataset.idx, btn.dataset.crit)];
    const isEmojiVal = cur != null && isNaN(Number(cur));

    popNums.querySelectorAll('.pop-num').forEach(el =>
      el.classList.toggle('active', !isEmojiVal && Number(el.dataset.val) === Number(cur))
    );
    popEmojis.querySelectorAll('.pop-emoji').forEach(el =>
      el.classList.toggle('active', el.dataset.val === cur)
    );

    popup.classList.add('open');
    reposition(btn);
  }

  function closePopup() { popup.classList.remove('open'); activeBtn = null; }

  function reposition(btn) {
    const r   = btn.getBoundingClientRect();
    const pw  = popup.offsetWidth  || 310;
    const ph  = popup.offsetHeight || 180;
    const gap = 8;
    let top  = r.top - ph - gap;
    let left = r.left + r.width / 2 - pw / 2;
    if (top < gap) top = r.bottom + gap;
    left = Math.max(gap, Math.min(left, innerWidth - pw - gap));
    popup.style.top  = top  + 'px';
    popup.style.left = left + 'px';
  }

  function setValue(val) {
    if (!activeBtn) return;
    const { idx, crit } = activeBtn.dataset;

    if (val === null) {
      delete votes[key(idx, crit)];
      activeBtn.textContent = '—';
      activeBtn.classList.remove('has-value', 'is-emoji');
    } else {
      votes[key(idx, crit)] = val;
      const isEmoji = isNaN(Number(val));
      activeBtn.textContent = val;
      activeBtn.classList.toggle('has-value', true);
      activeBtn.classList.toggle('is-emoji', isEmoji);
    }
    save();
    updateRankings();
    closePopup();
  }

  document.getElementById('main-table').addEventListener('click', e => {
    const btn = e.target.closest('.rating-btn');
    if (!btn) return;
    if (popup.classList.contains('open') && activeBtn === btn) { closePopup(); return; }
    openPopup(btn);
  });

  popNums.addEventListener('click', e => {
    const b = e.target.closest('.pop-num');
    if (b) setValue(+b.dataset.val);
  });
  popEmojis.addEventListener('click', e => {
    const b = e.target.closest('.pop-emoji');
    if (b) setValue(b.dataset.val);
  });

  popClear.addEventListener('click', () => setValue(null));

  document.addEventListener('click', e => {
    if (!popup.contains(e.target) && !e.target.closest('.rating-btn')) closePopup();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closePopup(); });

  // ── Reset ──
  document.getElementById('btn-reset').addEventListener('click', () => {
    if (!confirm('Скинути всі оцінки?')) return;
    votes = {};
    save();
    closePopup();
    document.querySelectorAll('.rating-btn').forEach(b => {
      b.textContent = '—';
      b.classList.remove('has-value', 'is-emoji');
    });
    updateRankings();
  });

  // ── Rankings ──
  function updateRankings() {
    const ranked = COUNTRIES
      .map((c, idx) => ({ ...c, idx, total: rowTotal(idx) }))
      .filter(c => c.total > 0)
      .sort((a, b) => b.total - a.total);

    const section = document.getElementById('rankings-section');
    const grid = document.getElementById('rankings-grid');

    if (!ranked.length) { section.style.display = 'none'; return; }

    section.style.display = '';
    grid.innerHTML = ranked.map((c, pos) => {
      const posCls = pos === 0 ? 'top1' : pos === 1 ? 'top2' : pos === 2 ? 'top3' : '';
      return `<div class="rank-card">
        <span class="rank-pos ${posCls}">${pos + 1}.</span>
        <span class="rank-flag">${c.flag}</span>
        <div class="rank-info"><div class="rank-country">${c.name}</div></div>
        <span class="rank-score">${c.total}</span>
      </div>`;
    }).join('');
  }

  updateRankings();

  // ── Personal picks ──
  const PICKS_KEY = 'esc2026_picks';
  let picks = {};
  try { picks = JSON.parse(localStorage.getItem(PICKS_KEY)) || {}; } catch {}
  function savePicks() { localStorage.setItem(PICKS_KEY, JSON.stringify(picks)); }

  // Build pick rows
  const picksCard = document.getElementById('picks-card');
  PICK_DEFS.forEach(def => {
    const row = document.createElement('div');
    row.className = 'pick-row' + (def.winner ? ' winner-row' : '');
    row.innerHTML = `
      <div class="pick-label">${def.label}:</div>
      <button class="pick-btn${hasPick(def) ? ' has-value' : ''}" data-pick="${def.id}">
        <span class="pick-btn-inner">${renderPickLabel(def)}</span>
        <span class="pick-chevron">▾</span>
      </button>
    `;
    picksCard.appendChild(row);

    if (def.multi) {
      const expanded = document.createElement('div');
      expanded.className = 'pick-expanded';
      expanded.id = `pick-expanded-${def.id}`;
      expanded.innerHTML = renderExpandedPicks(def);
      picksCard.appendChild(expanded);
    }
  });

  function hasPick(def) {
    const v = picks[def.id];
    return def.multi ? (v && v.length > 0) : (v != null && v !== '');
  }

  function renderPickLabel(def) {
    const val = picks[def.id];
    if (def.multi) {
      const arr = val || [];
      if (!arr.length) return '— оберіть —';
      return `${arr.map(i => COUNTRIES[i].flag).join(' ')}<span style="color:var(--text-dim);font-size:11px;margin-left:5px">${arr.length}/${def.max}</span>`;
    }
    if (val == null || val === '') return '— оберіть —';
    const c = COUNTRIES[val];
    return `<span style="font-size:18px;line-height:1">${c.flag}</span>&nbsp;${c.name}`;
  }

  function renderExpandedPicks(def) {
    const arr = picks[def.id] || [];
    return arr.map(i => {
      const c = COUNTRIES[i];
      return `<div class="pick-expanded-item">
        <span class="pick-expanded-flag">${c.flag}</span>
        <span>${c.name}</span>
        <span class="pick-expanded-artist">${c.artist}</span>
      </div>`;
    }).join('');
  }

  function refreshPickBtn(def) {
    const btn = picksCard.querySelector(`[data-pick="${def.id}"]`);
    if (!btn) return;
    btn.querySelector('.pick-btn-inner').innerHTML = renderPickLabel(def);
    btn.classList.toggle('has-value', hasPick(def));
    if (def.multi) {
      const expanded = document.getElementById(`pick-expanded-${def.id}`);
      if (expanded) expanded.innerHTML = renderExpandedPicks(def);
    }
  }

  // Country picker popup
  const cpicker        = document.getElementById('cpicker');
  const cpickerHeader  = document.getElementById('cpicker-header');
  const cpickerList    = document.getElementById('cpicker-list');
  const cpickerFooter  = document.getElementById('cpicker-footer');
  const cpickerCount   = document.getElementById('cpicker-count');
  const cpickerConfirm = document.getElementById('cpicker-confirm');
  let activeDef = null;
  let multiSel  = [];

  function openCpicker(btn, def) {
    activeDef = def;
    multiSel  = def.multi ? [...(picks[def.id] || [])] : [];
    cpickerHeader.textContent = def.label;
    cpicker.classList.toggle('winner-mode', !!def.winner);
    renderCpickerList();
    cpickerFooter.style.display = def.multi ? 'flex' : 'none';
    cpicker.classList.add('open');
    repositionCpicker(btn);
  }

  function renderCpickerList() {
    cpickerList.innerHTML = COUNTRIES.map((c, i) => {
      const isSel = activeDef.multi ? multiSel.includes(i) : picks[activeDef.id] === i;
      return `<div class="cpicker-item${isSel ? ' selected' : ''}" data-idx="${i}">
        <span class="cpicker-num">${String(i+1).padStart(2,'0')}</span>
        <span class="cpicker-flag">${c.flag}</span>
        <div class="cpicker-info">
          <div class="cpicker-name">${c.name}</div>
          <div class="cpicker-artist">${c.artist}</div>
        </div>
        ${isSel ? '<span class="cpicker-check">✓</span>' : ''}
      </div>`;
    }).join('');
    if (activeDef.multi) updateCpickerCount();
  }

  function updateCpickerCount() {
    cpickerCount.textContent = `${multiSel.length} / ${activeDef.max} обрано`;
    cpickerConfirm.disabled = multiSel.length === 0;
  }

  function closeCpicker() { cpicker.classList.remove('open'); activeDef = null; }

  function repositionCpicker(btn) {
    const r  = btn.getBoundingClientRect();
    const pw = 300;
    const ph = Math.min(440, innerHeight - 32);
    const gap = 8;
    let top  = r.top - ph - gap;
    let left = r.right - pw;
    if (top < gap) top = r.bottom + gap;
    if (top + ph > innerHeight - gap) top = innerHeight - ph - gap;
    left = Math.max(gap, Math.min(left, innerWidth - pw - gap));
    cpicker.style.top    = top  + 'px';
    cpicker.style.left   = left + 'px';
    cpicker.style.height = ph   + 'px';
  }

  picksCard.addEventListener('click', e => {
    const btn = e.target.closest('.pick-btn');
    if (!btn) return;
    const def = PICK_DEFS.find(d => d.id === btn.dataset.pick);
    if (!def) return;
    if (cpicker.classList.contains('open') && activeDef === def) { closeCpicker(); return; }
    openCpicker(btn, def);
  });

  cpickerList.addEventListener('click', e => {
    const item = e.target.closest('.cpicker-item');
    if (!item) return;
    const idx = +item.dataset.idx;
    if (activeDef.multi) {
      const pos = multiSel.indexOf(idx);
      if (pos >= 0) multiSel.splice(pos, 1);
      else if (multiSel.length < activeDef.max) multiSel.push(idx);
      else return;
      renderCpickerList();
    } else {
      picks[activeDef.id] = idx;
      savePicks();
      refreshPickBtn(activeDef);
      closeCpicker();
    }
  });

  cpickerConfirm.addEventListener('click', () => {
    picks[activeDef.id] = [...multiSel];
    savePicks();
    refreshPickBtn(activeDef);
    closeCpicker();
  });

  cpicker.addEventListener('click', e => e.stopPropagation());

  document.addEventListener('click', e => {
    if (!e.target.closest('.pick-btn')) closeCpicker();
  });

  // ── Image generation ──
  const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  const TEXT_FONT  = '"Segoe UI",system-ui,sans-serif';

  function canvasBg(ctx, W, H, pinkLeft) {
    const g = ctx.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, '#1d0a48'); g.addColorStop(0.6, '#2d0d5e'); g.addColorStop(1, '#150830');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    const a = ctx.createRadialGradient(pinkLeft ? 0 : W, 0, 0, pinkLeft ? 0 : W, 0, W * 0.7);
    a.addColorStop(0, pinkLeft ? 'rgba(255,148,198,0.22)' : 'rgba(130,215,255,0.18)');
    a.addColorStop(1, 'transparent');
    ctx.fillStyle = a;
    ctx.fillRect(0, 0, W, H);
  }

  function canvasHeader(ctx, W, PAD, subtitle, title) {
    ctx.globalAlpha = 0.35; ctx.fillStyle = '#ffffff';
    ctx.font = `12px ${TEXT_FONT}`;
    ctx.fillText(subtitle, PAD, 30);
    ctx.globalAlpha = 1; ctx.fillStyle = '#ffffff';
    ctx.font = `bold 28px ${TEXT_FONT}`;
    ctx.fillText(title, PAD, 62);
    ctx.globalAlpha = 0.12; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(PAD, 80); ctx.lineTo(W - PAD, 80); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  function dlCanvas(canvas, name) {
    const a = document.createElement('a');
    a.download = name; a.href = canvas.toDataURL('image/png'); a.click();
  }

  function generateRankingImage() {
    const ranked = COUNTRIES
      .map((c, idx) => ({ ...c, idx, total: rowTotal(idx) }))
      .filter(c => c.total > 0)
      .sort((a, b) => b.total - a.total);
    if (!ranked.length) { alert('Додайте оцінки, щоб згенерувати зображення'); return; }

    const SC = 2, W = 580, PAD = 28, ROW = 54, HDR = 102, FOOT = 28;
    const H = HDR + ranked.length * ROW + FOOT;
    const cv = document.createElement('canvas');
    cv.width = W * SC; cv.height = H * SC;
    const ctx = cv.getContext('2d');
    ctx.scale(SC, SC);

    canvasBg(ctx, W, H, true);
    canvasHeader(ctx, W, PAD, 'EUROVISION 2026 · ВІДЕНЬ', 'МІЙ РЕЙТИНГ');

    const MEDALS = ['🥇','🥈','🥉'];
    ranked.forEach((c, pos) => {
      const y = HDR + pos * ROW, cy = y + ROW / 2;
      if (pos % 2 === 0) { ctx.fillStyle = 'rgba(255,255,255,0.035)'; ctx.fillRect(0, y, W, ROW); }

      if (pos < 3) {
        ctx.globalAlpha = 1;
        ctx.font = `20px ${EMOJI_FONT}`; ctx.fillText(MEDALS[pos], PAD - 2, cy + 7);
      } else {
        ctx.globalAlpha = 0.32; ctx.fillStyle = '#ffffff'; ctx.font = `bold 12px ${TEXT_FONT}`;
        ctx.fillText(`${pos + 1}.`, PAD + 2, cy + 5);
      }

      ctx.globalAlpha = 1;
      ctx.font = `22px ${EMOJI_FONT}`; ctx.fillText(c.flag, PAD + 36, cy + 8);
      ctx.fillStyle = '#ffffff'; ctx.font = `bold 15px ${TEXT_FONT}`; ctx.fillText(c.name, PAD + 74, cy + 1);
      ctx.globalAlpha = 0.42; ctx.fillStyle = '#ffffff'; ctx.font = `12px ${TEXT_FONT}`; ctx.fillText(c.artist, PAD + 74, cy + 17);
      ctx.globalAlpha = 1; ctx.fillStyle = '#ff2d78'; ctx.font = `bold 22px ${TEXT_FONT}`;
      const sw = ctx.measureText(String(c.total)).width;
      ctx.fillText(String(c.total), W - PAD - sw, cy + 8);
    });

    dlCanvas(cv, 'my-rating-esc2026.png');
  }

  function generatePicksImage() {
    let contentH = 0;
    PICK_DEFS.forEach(def => {
      contentH += 28;
      if (def.multi) contentH += Math.max(1, (picks[def.id] || []).length) * 34 + 4;
      else           contentH += 38;
      contentH += 18;
    });

    const SC = 2, W = 580, PAD = 28, HDR = 102, FOOT = 28;
    const H = HDR + contentH + FOOT;
    const cv = document.createElement('canvas');
    cv.width = W * SC; cv.height = H * SC;
    const ctx = cv.getContext('2d');
    ctx.scale(SC, SC);

    canvasBg(ctx, W, H, false);
    canvasHeader(ctx, W, PAD, 'EUROVISION 2026 · ВІДЕНЬ', 'ОТЖЕ');

    let y = HDR + 12;
    PICK_DEFS.forEach(def => {
      ctx.globalAlpha = 0.42; ctx.fillStyle = '#ffffff';
      ctx.font = `italic bold 10px ${TEXT_FONT}`;
      ctx.fillText(def.label + ':', PAD, y);
      ctx.globalAlpha = 1;
      y += 22;

      if (def.multi) {
        const arr = picks[def.id] || [];
        if (!arr.length) {
          ctx.globalAlpha = 0.22; ctx.fillStyle = '#ffffff'; ctx.font = `14px ${TEXT_FONT}`;
          ctx.fillText('— не обрано —', PAD + 4, y + 8); y += 34;
        } else {
          arr.forEach(i => {
            const c = COUNTRIES[i];
            ctx.globalAlpha = 1;
            ctx.font = `18px ${EMOJI_FONT}`; ctx.fillText(c.flag, PAD, y + 4);
            ctx.fillStyle = '#ffffff'; ctx.font = `bold 14px ${TEXT_FONT}`; ctx.fillText(c.name, PAD + 30, y + 2);
            ctx.globalAlpha = 0.38; ctx.fillStyle = '#ffffff'; ctx.font = `11px ${TEXT_FONT}`; ctx.fillText(c.artist, PAD + 30, y + 16);
            y += 34;
          });
        }
      } else {
        const val = picks[def.id];
        if (val == null || val === '') {
          ctx.globalAlpha = 0.22; ctx.fillStyle = '#ffffff'; ctx.font = `14px ${TEXT_FONT}`;
          ctx.fillText('— не обрано —', PAD + 4, y + 8);
        } else {
          const c = COUNTRIES[val];
          ctx.globalAlpha = 1;
          ctx.font = `22px ${EMOJI_FONT}`; ctx.fillText(c.flag, PAD, y + 8);
          ctx.fillStyle = def.winner ? '#ffd700' : '#ffffff';
          ctx.font = `bold ${def.winner ? 18 : 15}px ${TEXT_FONT}`; ctx.fillText(c.name, PAD + 34, y + 4);
          ctx.globalAlpha = 0.38; ctx.fillStyle = '#ffffff'; ctx.font = `11px ${TEXT_FONT}`; ctx.fillText(c.artist, PAD + 34, y + 19);
        }
        y += 38;
      }

      ctx.globalAlpha = 0.07; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(PAD, y + 4); ctx.lineTo(W - PAD, y + 4); ctx.stroke();
      y += 18;
    });

    dlCanvas(cv, 'my-picks-esc2026.png');
  }

  document.getElementById('btn-dl-ranking')?.addEventListener('click', generateRankingImage);
  document.getElementById('btn-dl-picks')  ?.addEventListener('click', generatePicksImage);

</script>
</body>
</html>
